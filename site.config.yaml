# Thin site config - conventions handle the rest.
# Expand `include` when more categories are migrated.

site:
  name: DSAZen
  description: Patterns, theory, and practice for algorithms and data structures
  home_title: Dashboard

include:
  - "algorithms/search/**/practice/*.md"
  - "algorithms/sort/**/practice/*.md"
  - "algorithms/backtracking/practice/*.md"
  - "algorithms/bit_manipulation/practice/*.md"
  - "algorithms/kadane/practice/*.md"
  - "algorithms/math/practice/*.md"
  - "algorithms/string/**/practice/*.md"
  - "algorithms/graph/**/practice/0. curated.md"
  - "algorithms/graph/**/practice/1. practice.md"
  - "data_structures/**/practice/*.md"
  - "patterns/**/practice/*.md"

categories:
  - topic_id: algorithms
    label: Algorithms
  - topic_id: algorithms/search
    label: Search
    parent: algorithms
  - topic_id: algorithms/graph
    label: Graph
    parent: algorithms
  - topic_id: algorithms/graph/traversal
    label: Graph Traversal
    parent: algorithms/graph
  - topic_id: algorithms/graph/shortest_path
    label: Shortest Path
    parent: algorithms/graph
  - topic_id: algorithms/graph/shortest_path/single_source
    label: Single Source
    parent: algorithms/graph/shortest_path
  - topic_id: algorithms/graph/shortest_path/all_pair
    label: All Pairs
    parent: algorithms/graph/shortest_path
  - topic_id: algorithms/graph/mst
    label: Minimum Spanning Tree
    parent: algorithms/graph
  - topic_id: algorithms/graph/lca
    label: Lowest Common Ancestor
    parent: algorithms/graph
  - topic_id: algorithms/string
    label: String Algorithms
    parent: algorithms
  - topic_id: algorithms/sort
    label: Sort
    parent: algorithms
  - topic_id: algorithms/sort/comparison
    label: Comparison Sort
    parent: algorithms/sort
  - topic_id: algorithms/sort/non_comparison
    label: Non-Comparison Sort
    parent: algorithms/sort
  - topic_id: patterns
    label: Patterns
  - topic_id: patterns/optimization
    label: Optimization
    parent: patterns
  - topic_id: patterns/scanning
    label: Scanning
    parent: patterns
  - topic_id: data_structures
    label: Data Structures

homepage:
  default_view: global

views:
  - global
  - byTopic
  - byPattern
  - byDifficulty

progress:
  dedupe: slug

