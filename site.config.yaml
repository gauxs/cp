# Thin site config - conventions handle the rest.
# Expand `include` when more categories are migrated.

site:
  name: MyGrindSheet
  description: Patterns, theory, and practice for algorithms and data structures
  home_title: Dashboard

include:
  - "algorithms/search/**/practice/*.md"

categories:
  - topic_id: algorithms
    label: Algorithms
  - topic_id: algorithms/search
    label: Search
    parent: algorithms

homepage:
  default_view: global

views:
  - global
  - byTopic
  - byPattern
  - byDifficulty

progress:
  dedupe: slug

topics:
  algorithms/search/binary:
    label: Binary Search
  algorithms/search/exponential:
    label: Exponential Search
  algorithms/search/jump:
    label: Jump Search
  algorithms/search/quick_select:
    label: Quick Select
