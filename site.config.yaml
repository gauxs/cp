# Thin site config - conventions handle the rest.
# Expand `include` when more categories are migrated.

site:
  name: MyGrindSheet
  description: Patterns, theory, and practice for algorithms and data structures
  home_title: Dashboard

include:
  - "algorithms/search/**/practice/*.md"
  - "algorithms/sort/**/practice/*.md"
  - "data_structures/**/practice/*.md"
  - "patterns/**/practice/*.md"

categories:
  - topic_id: algorithms
    label: Algorithms
  - topic_id: algorithms/search
    label: Search
    parent: algorithms
  - topic_id: algorithms/sort
    label: Sort
    parent: algorithms
  - topic_id: algorithms/sort/comparison
    label: Comparison Sort
    parent: algorithms/sort
  - topic_id: algorithms/sort/non_comparison
    label: Non-Comparison Sort
    parent: algorithms/sort
  - topic_id: patterns
    label: Patterns
  - topic_id: patterns/optimization
    label: Optimization
    parent: patterns
  - topic_id: patterns/scanning
    label: Scanning
    parent: patterns
  - topic_id: data_structures
    label: Data Structures

homepage:
  default_view: global

views:
  - global
  - byTopic
  - byPattern
  - byDifficulty

progress:
  dedupe: slug

topics:
  algorithms/search/binary:
    label: Binary Search
  algorithms/search/exponential:
    label: Exponential Search
  algorithms/search/jump:
    label: Jump Search
  algorithms/search/quick_select:
    label: Quick Select
  algorithms/sort/comparison/bubble:
    label: Bubble Sort
  algorithms/sort/comparison/selection:
    label: Selection Sort
  algorithms/sort/comparison/insertion:
    label: Insertion Sort
  algorithms/sort/comparison/merge:
    label: Merge Sort
  algorithms/sort/comparison/quick:
    label: Quick Sort
  algorithms/sort/comparison/heap:
    label: Heap Sort
  algorithms/sort/comparison/shell:
    label: Shell Sort
  algorithms/sort/non_comparison/counting:
    label: Counting Sort
  algorithms/sort/non_comparison/radix:
    label: Radix Sort
  algorithms/sort/non_comparison/bucket:
    label: Bucket Sort
  patterns/optimization/dp:
    label: Dynamic Programming
  patterns/optimization/greedy:
    label: Greedy
  patterns/scanning/sliding_window:
    label: Sliding Window
  patterns/scanning/intervals:
    label: Intervals
  patterns/divide_and_conquer:
    label: Divide and Conquer
  data_structures/heap:
    label: Heap (Priority Queue)
